version: "3.8"

services:
    backend: 
      build: .
      container_name: backend
      restart: always
      expose:
        - "${PORT}:${PORT}"
      env_file:
        - .env
      networks:
        - app-network

    caddy:
      image: caddy:latest
      container_name: caddy
      ports:
        - "80:80"   # public HTTP port - required to have a http
        - "443:443" # public HTTPS port - encrypted traffic
      volumes:
        - ./Caddyfile:/etc/caddy/Caddyfile
        - caddy_data:/data
        - caddy_config:/config
      depends_on:
        - backend
      networks:
        - app-network
   
networks:
  app-network:
volumes:
  caddy_data:
  caddy_config:
    
