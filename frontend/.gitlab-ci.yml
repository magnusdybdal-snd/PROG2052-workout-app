# Pipeline to check if gradle builds before merge_request_event.

stages: [build]

image: mobiledevops/android-sdk-image:34.0.1

variables:
  ANDROID_PROJECT_DIR: "."   
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs='-Xmx2g'"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - ./

build_android_debug:
  stage: build
  before_script:
#    - test -d "$ANDROID_PROJECT_DIR" || (echo "Folder '$ANDROID_PROJECT_DIR' not found"; ls -la; exit 1)
#    - cd "$ANDROID_PROJECT_DIR"
    - chmod +x .frontend/gradlew
    - ./gradlew --version
  script:
    - ./gradlew clean
    - ./gradlew assembleDebug --stacktrace --no-daemon -x test
  artifacts:
    when: on_failure
    paths:
      - $ANDROID_PROJECT_DIR/app/build/outputs/**/*
